# Cloudflare project config for highlandhideaway.ca.
#
# Static assets are deployed as a Worker via `wrangler deploy` + [assets],
# matching the pattern in ~/work/tools-portfolio/sites/rural/wrangler.toml
# rather than classic Pages + `wrangler pages deploy`.
#
# Deliberate divergence from tools-portfolio: this repo does NOT use
# Cloudflare's Git integration. GitHub Actions builds and deploys, because
# .github/workflows/cloudflare.yml gates the deploy on htmltest via `needs:`.
# With Git integration the deploy does not wait for CI and only branch
# protection stands in front of production; here the gate is structural.
# Two repo-specific reasons reinforce it: the DoIt theme is a git submodule
# Cloudflare's builder would have to init, and there is no package.json, so
# Hugo and htmltest would both need installing inside the build command.
#
# Dashboard configuration required. This list exists because configuration
# that lives only in the dashboard is invisible to code review, and this
# project has already lost one item that way -- see the Redirect Rule below.
# Add to it rather than relying on memory.
#
#   Custom domain    (Workers & Pages → the Worker → Settings)
#       highlandhideaway.ca and www.highlandhideaway.ca. Also declared in
#       `routes` below, and attached on deploy.
#
#   Build/deploy     (Workers & Pages → the Worker → Settings)
#       none. Actions deploys; leave Git integration disconnected.
#
#   Redirect Rule    (Rules → Redirect Rules)
#       "Redirect from WWW to root [Template]": wildcard pattern
#       https://www.* -> https://${1}, 301, preserve query string. Created
#       and verified 2026-08-21 (ISS-27). Also required: SSL/TLS -> Edge
#       Certificates -> "Always Use HTTPS", enabled the same day -- the
#       rule's pattern only matches an https:// request, so plain
#       http://www traffic needs that separate upgrade first (two 301 hops:
#       http://www -> https://www -> https://apex). https://www requests,
#       which is the common case, get a single hop straight to the apex.
#
#   Web Analytics    (Analytics → Web analytics → highlandhideaway.ca)
#       Set to "Enable, excluding visitor data in the EU". Cloudflare
#       injects the beacon at the edge, so it does not appear in ./public
#       and hugo.toml sets no beacon of its own -- setting one would put a
#       second beacon on the page and double-count. Injection fires only
#       for requests that advertise Accept: text/html, and never for EU
#       visitors, who are therefore absent from the numbers entirely.
#
#       Do not switch this to "Enable with JS Snippet installation". That
#       turns edge injection off and expects a manual tag, which this repo
#       deliberately does not carry -- page analytics would stop silently.
#       That is a dashboard click with no commit here to notice it, which
#       is why script/monitor beacon checks the live pages daily, and why
#       it pins the token: a recreated Web Analytics site issues a new one
#       and the views then land somewhere the Grafana queries do not look.
#
#       Two different identifiers, easily confused:
#         beacon token  2e7e343f80d04a2d9f9d49013c3c2d92  (in page source)
#         GraphQL siteTag  d6c7d92c76644885840437e3fdf3b867
#       The siteTag is what filters rumPageloadEventsAdaptiveGroups. The
#       account holds other sites, so an unfiltered query mixes them.
#
#   Email Routing   (Email -> Email Routing)
#       stay@highlandhideaway.ca forwards to Ben's inbox. It is published on
#       /posts/contact/ because My Haliburton Highlands will not list the
#       cottage without owner contact details on the site (ISS-56).
#
#       It is an alias, not a mailbox, and it is disposable on purpose: if it
#       gets harvested, add a second alias, change the one line on the contact
#       page, then delete this routing rule. The personal address behind it
#       never appears in public and never has to move.
#
#       Enabled 2026-09-03. It added five records the dashboard then marks
#       Locked, meaning protected from edits, not blocked: three MX to
#       route1-3.mx.cloudflare.net, one SPF TXT
#       (v=spf1 include:_spf.mx.cloudflare.net ~all), and a DKIM key at
#       cf2024-1._domainkey, which Cloudflare signs forwarded mail with. The
#       zone carried no MX records before that date, so nothing was displaced.
#       Anything that later wants to receive mail on this domain has to go
#       through Email Routing rather than alongside it.
#
#       Do not hand-write an SPF record here. The DNS page recommends an
#       Email Record Creator that writes "v=spf1 -all" along with DMARC and a
#       null DKIM key. A domain may hold only one SPF record, so adding that
#       one either collides with the record above or stops Email Routing
#       activating. DMARC is the only part of that wizard worth having, and it
#       goes in by hand as a separate _dmarc TXT record.
#
#       Leave the catch-all off -- it is Disabled, action Drop. Mail to any
#       other local part is then refused, which keeps a dictionary attack on
#       the domain out of the destination inbox and holds the blast radius to
#       the one address published on the site.
#
#       The destination is a plus-addressed Gmail, so the tag is a filter
#       handle on the receiving side. It appears only in the headers of the
#       forwarded message and never to anyone writing in.
#
#       Inbound only. Email Routing does not send, so replies leave from
#       Ben's own address unless send-as is configured through a provider.
#
# Break-glass local deploy from the repo root:
#   hugo --minify && npx wrangler deploy
name = "highlandhideaway"
main = "src/worker.js"
compatibility_date = "2026-08-18"

# Custom domains, attached on deploy. Declared here rather than clicked into
# the dashboard so the hostnames live in version control. The apex serves the
# site; www must stay listed so it still resolves to Cloudflare, which is what
# lets the www->apex Redirect Rule fire at the edge. Removing the www route
# would stop www resolving at all, and the redirect with it.
routes = [
  { pattern = "www.highlandhideaway.ca", custom_domain = true },
  { pattern = "highlandhideaway.ca", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Only the booking redirect needs the Worker; everything else is served
# straight from the asset store without invoking it.
run_worker_first = ["/go/*"]
# Serve Hugo's generated 404.html for unknown paths.
not_found_handling = "404-page"

[vars]
BOOKING_URL = "https://airbnb.ca/h/hideaway-near-haliburton"

# booking_clicks columns, in write order. Append only: every Grafana panel
# reads blobs positionally, so inserting a field silently reinterprets every
# row already written.
#
#   blob1  ?src=   the page the click came from
#   blob2  referer
#   blob3  country          (request.cf.country)
#   blob4  ?pos=   which CTA: inline, rail          added 2026-08-20
#   blob5  bot verdict: "bot" or "human"            added 2026-08-20, ISS-36
#   blob6  user agent, first 128 chars              added 2026-08-20, ISS-36
#   blob7  network operator (request.cf.asOrganization)  added 2026-08-20
#
# Rows written before a field existed carry fewer blobs, so filter with
# care -- blob5 = '' means "written before we classified", not "human".
[[analytics_engine_datasets]]
binding = "CLICKS"
dataset = "booking_clicks"
