# The apex is canonical: a Cloudflare Redirect Rule 301s www -> apex,
# preserving path and query. baseURL must match the hostname that actually
# serves, or canonical URLs, the sitemap and Open Graph tags all point
# somewhere other than the page they describe.
#
# Redirect Rule created and verified 2026-08-21 (ISS-27); see the dashboard
# list in wrangler.toml. Plain http://www requests take two hops -- Always
# Use HTTPS upgrades to https://www first, then the rule fires -- because
# the rule's wildcard pattern only matches an https:// request. Requests
# already on https://www (the common case: Search Console, sitemap,
# internal links) get a single 301 straight to the apex.
baseURL = 'https://highlandhideaway.ca/'

# Hugo does not emit robots.txt unless asked, so production was serving
# Cloudflare's managed robots.txt instead -- which carries no Sitemap line.
enableRobotsTXT = true
title = 'Highland Hideaway'
theme = 'DoIt'

# Language settings
defaultContentLanguage = "en"
languageCode = 'en-us'

# Menu config. The URLs are unchanged -- only the labels moved -- so existing
# internal links, the sitemap and htmltest are unaffected.
[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    name = "Guides"
    url = "/posts/"
    title = ""
  [[menu.main]]
    weight = 2
    identifier = "photos"
    name = "The Property"
    url = "/photos/"
    title = ""
  [[menu.main]]
    weight = 3
    identifier = "about"
    name = "About"
    url = "/about/"
    title = ""

# Hugo Pipes can only process files it sees under assets/. The images live in
# static/ and are referenced as plain "/images/foo.jpg" from featuredImage front
# matter, from {{< image >}}, and -- crucially -- raw from head/seo.html,
# rss/item.html, plugin/share.html and the params.images / seo.images /
# home.profile.avatarURL settings below. Moving them would 404 every JSON-LD,
# RSS and Open Graph image, so the same directory is mounted twice instead: once
# as static (published verbatim) and once as assets (resources.Get resolves it,
# so params.image.optimise below can generate WebP srcsets).
#
# Declaring any mount replaces ALL of Hugo's defaults, hence the seven
# re-declarations before the one that actually does the work.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

[params]
  # DoIt theme version
  version = "0.4.0"
  # site default theme ("light", "dark", "auto")
  defaultTheme = "light"
  # date format
  dateFormat = "2006-01-02"
  # website title for Open Graph and Twitter Cards
  title = "Highland Hideaway"
  # website description for RSS, SEO, Open Graph and Twitter Cards
  description = 'A peaceful retreat in the heart of the Highlands'
  keywords = 'cottage, vacation, highlands, retreat'
  # Second half of the post hero eyebrow; the first half is the category.
  region = "Haliburton Highlands"
  # Default share image. Hugo's _internal/opengraph.html and
  # _internal/twitter_cards.html (which DoIt calls) read params.images —
  # NOT params.seo.images — and twitter:card is upgraded to
  # summary_large_image automatically once an image is present.
  images = ["/images/dock-autumn.jpg"]
  
  # Turn on the theme's image pipeline. Combined with the static/images ->
  # assets/images mount above, every featuredImage and {{< image >}} gains an
  # 800/1200/1600w WebP srcset and intrinsic width/height.
  [params.image]
    optimise = true

  # Header wordmark. Setting header.title at all skips the theme's .Site.Title
  # fallback, so name has to be spelled out or the wordmark disappears.
  # partials/header.html renders logo through plugin/image.html at 32x32 in both
  # the desktop and mobile headers; _custom.scss rounds it.
  [params.header]
    [params.header.title]
      logo = "/images/site-avatar-small.png"
      name = "Highland Hideaway"

  # Home profile config
  [params.home.profile]
    avatarURL = "/images/site-avatar-small.png"
    title = "Highland Hideaway"
    subtitle = "A peaceful retreat"

  # ISS-34. Two separate things stop DoIt's blogroll, and it takes both:
  #
  #   layouts/index.html is the home page now, and it never draws the post list.
  #
  #   This flag stops head/paginator.html -- which baseof.html calls on every
  #   page, before any layout runs -- from paginating the home page. Without it
  #   Hugo publishes /page/1/, /page/2/ and /page/3/ even though nothing renders
  #   a paginator, each one a full copy of the home page at its own URL. Three
  #   near-duplicates of the page most likely to rank for the brand, days before
  #   Search Console's first crawl (ISS-27), so it is not cosmetic. Measured:
  #   removing this line brings all three back.
  #
  # The [params.home.profile] block above is no longer drawn -- the hero carries
  # the title now -- but is left in place so that deleting layouts/index.html
  # restores the previous home page exactly. See that file's header (ISS-35).
  [params.home.posts]
    enable = false
  
  # Booking / conversion target. The whole site funnels here, so it is
  # defined once and used via the {{< book >}} shortcode.
  [params.booking]
    # Routed through the Worker in src/worker.js, which counts the click and
    # 302s to the listing. partials/booking-url.html appends ?src= with the page
    # path and &pos= with the placement.
    url = "/go/airbnb"
    text = "Book now on Airbnb"
    # The sticky rail card on every post. Figures are from docs/current_content.md.
    railText = "Check dates on Airbnb"
    railTitle = "Your basecamp for all of this"
    # The mobile bar (ISS-33). Its own, shorter label: the bar is 390px wide
    # with the room counts beside it, and railText wraps to two lines there.
    barText = "Check dates"
    pitch = "A three-bedroom cottage on 23 private acres, dock across the road. Sleeps up to six."
    bedrooms = 3
    bathrooms = 1
    guests = 6
    acres = 23
    askText = "Prefer to ask first?"
    askLinkText = "Contact us"
    askURL = "/posts/contact/"

  # Author config
  [params.author]
    name = "Highland Hideaway"
    email = ""
    link = ""

  # SEO config
  [params.seo]
    # images for Open Graph and Twitter Cards
    images = ["/images/dock-autumn.jpg"]
    # Twitter Cards config
    [params.seo.twitter]
      # Twitter Card type ("summary", "summary_large_image")
      card = "summary_large_image"

  # Analytics config.
  #
  # Nothing here renders a tag any more, and that is deliberate.
  #
  # Google Analytics was removed on 2026-08-20 (ISS-28). Page analytics is
  # Cloudflare Web Analytics, which is cookieless -- so the site raises no
  # consent obligation and needs neither a banner nor a privacy notice. That
  # is what closed ISS-11.
  #
  # The Cloudflare beacon is NOT configured here. Cloudflare injects it at
  # the edge, from the automatic setup enabled on the Web Analytics site
  # (token 2e7e343f80d04a2d9f9d49013c3c2d92 -- public, it ships in page
  # source). The theme supports a manual beacon via
  # params.analytics.cloudflare.token; setting it would put a SECOND beacon
  # on the page and double-count every view. Do not set it while automatic
  # injection is on.
  #
  # Injection is conditional, so the beacon's absence from a plain curl
  # proves nothing. The gate is the Accept header, NOT the User-Agent: a
  # curl sending a Chrome User-Agent and no Accept header still gets a
  # page with no beacon in it, which is a good way to conclude analytics
  # is broken when it is fine. To check by hand:
  #
  #   curl -s https://highlandhideaway.ca/ -H "Accept: text/html" \
  #     | grep -o "data-cf-beacon='[^']*'"
  #
  # script/monitor beacon does that against three pages and also asserts
  # the token above, and runs daily from .github/workflows/monitor.yml.
  #
  # Booking conversions do not run through any analytics product. They are
  # counted server-side by src/worker.js.
  #
  # See wrangler.toml for the dashboard settings this depends on.
  [params.analytics]
    enable = false

  # Comment config
  [params.comment]
    # Disqus comment system
    disqus = ""
    # Gitalk comment system
    [params.comment.gitalk]
      owner = ""
      repo = ""
      clientId = ""
      clientSecret = ""
    # Valine comment system
    [params.comment.valine]
      appId = ""
      appKey = ""
      placeholder = ""
    # Waline comment system
    [params.comment.waline]
      serverURL = ""
      lang = ""
      emoji = []
    # Facebook comment system
    [params.comment.facebook]
      appId = ""
      userID = ""
      pageID = ""
    # Telegram comment system
    [params.comment.telegram]
      siteID = ""
      limit = 5
      height = ""
      color = ""
    # Commento comment system
    [params.comment.commento]
      url = ""
    # Utterances comment system
    [params.comment.utterances]
      repo = ""
    # Twikoo comment system
    [params.comment.twikoo]
      envId = ""
      region = ""
      path = ""
    # Vssue comment system
    [params.comment.vssue]
      owner = ""
      repo = ""
      clientId = ""
      clientSecret = ""
    # Remark42 comment system
    [params.comment.remark42]
      host = ""
      site_id = ""
      max_shown_comments = 15
      theme = "light"
    # Giscus comment system
    [params.comment.giscus]
      repo = ""
      repoId = ""
      category = ""
      categoryId = ""
      mapping = "pathname"
      reactionsEnabled = "1"
      emitMetadata = "0"
      inputPosition = "bottom"
      theme = "light"
    # Artalk comment system
    [params.comment.artalk]
      server = ""
      site = ""
      placeholder = ""
      noComment = ""
      sendBtn = ""
      editorTravel = true
      flatMode = false
      maxNesting = 3
      pageKey = ""
      pageTitle = ""
      pageAdmin = ""
      pageAdminMail = ""
      gravatar = ""
      avatar = ""
      vote = true
      voteDown = false
      uaBadge = true
      listSort = "date_desc"
      preview = true
      countEl = "#ArtalkCount"
      pvEl = "#ArtalkPV"
      lightbox = true
      heightLimit = 2500
      imgUpload = true
      imgUploader = ""
      emoticons = ""

[build]
  writeStats = true
  noChmod = true
  noTimes = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # This allows raw HTML in markdown files
